[bootstrap.packages]
"brew-cask:docker" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:nordvpn" = "latest"

[bootstrap.macos.dock]
apps = [
    "/System/Applications/System Settings.app",
    "/System/Applications/Utilities/Terminal.app",
    "/System/Applications/Apps.app",
    "/Applications/Google Chrome.app",
    "/Applications/Visual Studio Code.app",
    "/Applications/Docker.app",
    "/Applications/Obsidian.app",
    "/Applications/NordVPN.app",
]

[dotfiles]
# mise
"~/.config/mise/config.local.toml/optional" = { block = """
[tools]
opencode = { version = "2.2.7", allow_builds = ["@opencode/cli"] }
""" }
# opencode
"~/.config/opencode/agents" = "opencode/agents"
"~/.config/opencode/commands" = "opencode/commands"
"~/.config/opencode/opencode.jsonc" = "opencode/opencode.jsonc"
"~/.config/opencode/AGENTS.md" = "opencode/AGENTS.md"
